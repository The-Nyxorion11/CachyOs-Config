# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

exec-once = hyprlock &
exec-once = swaync &
exec-once = hypridle -c ~/.config/hypr/hypridle.conf &
exec-once = waybar &
exec-once = fcitx5 -d &
exec-once = nm-applet --indicator &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown" &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = bash ~/Scripts/wallpaper.sh &

#for battery management
exec-once = ~/Scripts/batinfo.sh &

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

# ## Idle configuration
exec-once = $idlehandler
#########exec-once = mpvpaper -o "no-audio loop-file=inf" eDP-1 /home/thenyxorion/Vídeos/wallpapers/gatoWindows.mp4
#exec-once = bash ~/Scripts/clearCache.sh &
exec-once = bash ~/Scripts/carga.sh &
